version: '3.8'

services:

  # ==========================================
  # 1. BANCO DE DADOS RELACIONAL (Origem dos Dados)
  # Este banco guarda as compras e transações falsas criadas pelo faker.
  # ==========================================
  postgres-origem:
    image: postgres:15
    container_name: postgres-origem
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata_origem:/var/lib/postgresql/data
      - ./init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
    restart: always


  # ==========================================
  # 2. OBJECT STORAGE (Nosso Data Lake Local - MinIO)
  # Onde os dados Landing (CSV) e Delta Lake ficarão salvos.
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: minio-datalake
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000" # Porta da API (para o Spark e Airflow conectarem)
      - "9001:9001" # Porta do Console (Acesse no seu navegador)
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - minio_data:/data
    restart: always

  # Container temporário apenas para criar as pastas da Arquitetura Medalhão no MinIO.
  minio-init:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 admin adminpassword;
      mc mb myminio/landing;
      mc mb myminio/bronze;
      mc mb myminio/silver;
      mc mb myminio/gold;
      exit 0;
      "


  # ==========================================
  # 3. DOCUMENTAÇÃO (MkDocs)
  # Hospeda a documentação obrigatória do trabalho.
  # ==========================================
  mkdocs:
    image: squidfunk/mkdocs-material:latest
    container_name: mkdocs-docs
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    restart: always


  # ==========================================
  # 4. FERRAMENTA DE DASHBOARD (Metabase) -> NOVO!
  # Use para criar os 4 KPIs e as 2 métricas (One Page View).
  # Obs: Você acessa ele na porta 3000.
  # ==========================================
  metabase:
    image: metabase/metabase:latest
    container_name: metabase-dashboard
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=h2
    volumes:
      - metabase_data:/metabase.db
    restart: always


  # ==========================================
  # 5. ORQUESTRAÇÃO DE DADOS (Apache Airflow) -> NOVO!
  # ==========================================
  
  # O Airflow precisa de um banco próprio para controlar o que já rodou e agendar as dags.
  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    ports:
      - "5433:5432" # Mapeado para 5433 para não bater com o banco de origem (5432)!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata_airflow:/var/lib/postgresql/data
    restart: always

  # Instala e inicializa o banco do Airflow e cria o usuário Admin.
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    user: "0:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    # Cria as tabelas do airflow e um usuário login: admin / senha: admin
    entrypoint: >
      /bin/sh -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Airflow --lastname Admin --role Admin --email admin@example.com || true
      "

  # O cérebro do Airflow (Webserver + Interface visual na porta 8080)
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080" # Interface visual do Airflow (usuário admin, senha admin)
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config.py:/opt/airflow/config.py
      - ./schemas.py:/opt/airflow/schemas.py
      - ./pipeline:/opt/airflow/pipeline
      - ./gold:/opt/airflow/gold
    command: webserver
    restart: always

  # O funcionário que fica monitorando o tempo e acionando as DAGs quando precisa
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config.py:/opt/airflow/config.py
      - ./schemas.py:/opt/airflow/schemas.py
      - ./pipeline:/opt/airflow/pipeline
      - ./gold:/opt/airflow/gold
    command: scheduler
    restart: always


volumes:
  pgdata_origem:
  minio_data:
  metabase_data:
  pgdata_airflow:
